# Commissioned audio chapter MVP: settings.
# API keys live in .env (gitignored), never here.

models:
  writer: claude-opus-5-5     # map, angles, ledger, ledger update, brief, draft, coverage, edit, revise, baseline
  researcher: claude-sonnet-5-5 # one research agent per ledger row. beauty-scarry ran them on Opus 5.5
                                # ($8.74 of $17.74); Sonnet 5.5 is half the rate (cost pass, 2026-11-11)
  cheap: claude-haiku-5-5     # mechanical steps (currently: the ping test call)
  guide: claude-sonnet-5-5    # the voice guide's conversation (Phase 1): fast replies matter more than depth,
                              # and it is the fastest Claude that ElevenLabs Agents offers natively
                              # (docs/elevenlabs-agents-check.md), so the text chat tunes the same model

# On a safety-classifier decline, the API re-runs the same request on a fallback
# model inside the same call ("default" lets the API pick by refusal category).
# The log records which model actually served each call. Set to null to turn off.
refusal_fallbacks: default
refusal_fallbacks_beta: server-side-fallback-2026-07-01

# Stop and ask before any single call or stage expected to cost more than this.
cost_guard_usd: 5.00

# Per-stage request settings. max_tokens covers thinking plus text; every call
# streams, so large values are safe. Effort: low | medium | high | xhigh | max.
# expected_* feed the cost guard's estimate only.
# model: overrides the role's model for that stage.
# batch: true sends the stage through the Message Batches API at half price. Only
# for single requests without tools; slower (usually minutes, up to the timeout in
# `batch:` below, then it streams instead) and without refusal fallbacks (a refused
# batch request is re-sent streamed, with them). draft and revise make one call per
# segment in sequence, so batching them would multiply the wait; they stream.
stages:
  ping:     {max_tokens: 1024, effort: low, expected_output_tokens: 20}
  guide:    {max_tokens: 4000, effort: low, expected_output_tokens: 400}
  memory:   {max_tokens: 16000, effort: high, expected_output_tokens: 3000}  # after a conversation (Opus)
  smoketest: {max_tokens: 4000, effort: low, expected_output_tokens: 1000}
  # beauty-scarry, 2026-11-11: map hit 32000 (thinking + ~6,400 words of map) and angles used
  # 17,838 (over its old 16000) before finishing, so stages that write a long document get
  # 64000 (Opus 5.5 allows 128000). Billing is per token used; the guard uses expected_*.
  map:      {max_tokens: 64000, effort: high, batch: true, expected_output_tokens: 40000}
  scout:    {max_tokens: 64000, effort: high, expected_output_tokens: 16000, max_continuations: 6}
  scout_writeup: {max_tokens: 64000, effort: high, expected_output_tokens: 12000}
  angles:   {max_tokens: 32000, effort: high, batch: true, expected_output_tokens: 18000}
  choose:   {max_tokens: 32000, effort: high, batch: true, expected_output_tokens: 8000}
  ledger:   {max_tokens: 64000, effort: high, batch: true, expected_output_tokens: 8000}
  research_row:      {max_tokens: 64000, effort: high, expected_output_tokens: 16000, max_continuations: 6}
  research_followup: {max_tokens: 64000, effort: high, expected_output_tokens: 12000, max_continuations: 6}
  research_writeup:  {max_tokens: 64000, effort: high, expected_output_tokens: 12000}
  ledger_update:     {max_tokens: 64000, effort: high, model: claude-sonnet-5-5, batch: true, expected_output_tokens: 8000}
  brief:    {max_tokens: 64000, effort: high, batch: true, expected_output_tokens: 8000}
  draft:    {max_tokens: 32000, effort: high, expected_output_tokens: 5000}
  coverage: {max_tokens: 64000, effort: high, model: claude-sonnet-5-5, batch: true, expected_output_tokens: 8000}
  edit:     {max_tokens: 64000, effort: high, batch: true, expected_output_tokens: 12000}
  factcheck: {max_tokens: 64000, effort: high, batch: true, expected_output_tokens: 10000}
  ask_grade: {max_tokens: 64000, effort: high, batch: true, expected_output_tokens: 12000}  # ask/scenarios.py: grades the asides (Opus)
  revise:   {max_tokens: 32000, effort: high, expected_output_tokens: 5000}
  baseline: {max_tokens: 64000, effort: high, expected_output_tokens: 30000, expected_input_tokens: 250000}
  # Fast Start (docs/fast-start.md; code in faststart/). A listener is waiting, so nothing is batched.
  # The opening's two calls run at medium: they stand between the listener and the first audio.
  fast_scout:         {model: claude-opus-5-5, max_tokens: 32000, effort: low, expected_output_tokens: 6000, max_continuations: 4}
  fast_scout_writeup: {model: claude-opus-5-5, max_tokens: 32000, effort: low, expected_output_tokens: 5000}
  fast_scout_match:   {model: claude-haiku-5-5, max_tokens: 1024, effort: low, expected_output_tokens: 20}
  fast_outline:       {max_tokens: 32000, effort: medium, expected_output_tokens: 5000}
  fast_outline_edit:  {max_tokens: 32000, effort: medium, expected_output_tokens: 5000}
  fast_opening:       {max_tokens: 32000, effort: medium, expected_output_tokens: 4000}
  fast_opening_edit:  {max_tokens: 32000, effort: medium, expected_output_tokens: 4000}
  fast_draft:         {max_tokens: 32000, effort: high, expected_output_tokens: 5000}
  fast_lock:          {max_tokens: 64000, effort: high, expected_output_tokens: 9000}
  fast_note:          {model: claude-sonnet-5-5, max_tokens: 4000, effort: low, expected_output_tokens: 300}
  fast_compare:       {max_tokens: 64000, effort: high, expected_output_tokens: 8000}

chapter:
  target_words: 6000
  target_minutes: 40
  min_segments: 6
  max_segments: 8
  segment_words: [750, 800]

# Ledger-driven research (docs/ledger-research-addon.md). Stage 03b writes 5-7
# ranked ideas to ledger.json; stage 04 runs one agent per active row, with a
# budget set by the row's rank and type; stage 04b judges each row and gives
# open or partial rows one follow-up agent.
research:
  min_rows: 5
  max_rows: 7
  top_ranks: 3                # ranks 1-3 get the "top" budget
  budgets:                    # per agent; the web tools' max_uses
    top:      {searches: 8, fetches: 4}   # deep-dive or missing, rank 1-3
    rest:     {searches: 4, fetches: 2}   # deep-dive or missing, rank 4 and below
    covered:  {searches: 2, fetches: 1}   # verify-only agent
    followup: {searches: 4, fetches: 2}   # the one follow-up round in stage 04b
  followup_max_rank: 3        # only rows ranked 1-3 get a follow-up (null: all). beauty-scarry: 4 of 5
                              # follow-ups still ended partial, $3.74 for little
  max_searches: 40            # all research agents together, follow-ups included; asks before going past
  parallel_agents: 4          # agents running at once
  max_usd: 25.00              # hard stop on research spend (agents and write-ups) in one invocation
  max_fetch_tokens: 20000     # cap on each fetched page's size in context
  # Domains whose tier is clear, for a check of the tiers agents record.
  # An entry claiming a better tier than its source's domain is flagged, never changed.
  tier_domains:
    gutenberg.org: 1
    perseus.tufts.edu: 1
    wikisource.org: 1
    plato.stanford.edu: 2
    iep.utm.edu: 2
    wikipedia.org: 4

# Seed runs (docs/phase1-onboarding.md): a 20-minute lesson made from a listener's seed, with no
# transcript. These values replace the ones above for any run with 00_source/seed.md.
seed_runs:
  chapter: {target_words: 3000, target_minutes: 20, min_segments: 4, max_segments: 4, segment_words: [700, 800]}
  research: {min_rows: 3, max_rows: 4}
  # A listener is waiting (the guide says about 20 minutes), so a seed run streams every stage:
  # the Batches API would save about $1.50 a lesson but add minutes to each batched stage.
  stages:
    angles: {batch: false}
    choose: {batch: false}
    ledger: {batch: false}
    ledger_update: {batch: false}
    brief: {batch: false}
    coverage: {batch: false}
    edit: {batch: false}
    factcheck: {batch: false}

# The scout maps the territory around a seed and finds candidate sources: the role the
# episode map plays for a transcript. One agent, these budgets (its web tools' max_uses).
scout:
  searches: 10
  fetches: 5

# `new --unattended`: nobody is asked anything. Each guard approves a stage if the run's
# spend plus the stage's estimate stays under this cap, and stops the run (with a report)
# if not; every request also checks the cap. Starting such a run is the approval.
unattended:
  max_run_usd: 20.00

# Minutes each step of an unattended seed run takes, for the page's "about N min". First guesses
# (about 25 in all); status.json records each step's real duration ("history") to calibrate them.
status_minutes:
  scout: 3
  angles: 1
  choose: 1
  ledger: 1
  research: 6
  ledger-update: 3
  brief: 1
  draft: 3
  assemble: 0
  coverage: 1
  edit: 1
  factcheck: 2
  revise: 2
  narrate: 2
  episode: 0
  report: 0

# The guide's conversation (Phase 1, milestone 3): prompts/guide.md, prompts/guide_tools.json.
guide:
  name_draw: 5            # names drawn from prompts/guide_names.md for a first meeting
  spark_draw: 3           # subjects drawn from prompts/guide_sparks.md, for the small delight it offers
  max_tool_rounds: 4      # tool calls the guide may chain in one turn
  max_session_usd: 2.00   # a conversation stops talking past this

# The guide's voice (Phase 1, milestone 4): an ElevenLabs agent made from prompts/guide.md and
# prompts/guide_tools.json by `python cli.py voice-agent`, kept in step with them (the server re-syncs
# it when they change). The id is saved in listener/voice.json. Effort `none` is Ian's pick for
# latency (2026-11-12); the typed chat runs at `low` (stages.guide). `python cli.py voice-compare`
# sends the same scripted turns to both and writes the replies side by side.
voice:
  agent_name: write-listen guide
  llm: claude-sonnet-5-5        # offered with reasoning effort none..max (llm.list, 2026-11-12)
  reasoning_effort: low         # was none (Ian, for latency). At none the model has nowhere to think, and
                                # in 2 of 6 test conversations it reasoned aloud ("They haven't picked, so
                                # I'll decide..."), which the voice would speak; at low, 0 of 3, with shorter
                                # turns. The latency check found no gain from none (0.99 s against 0.87 s).
  tts_model: eleven_v4_turbo    # ~100 ms; eleven_v4 (narration) is not offered for agents
  voice_id: null                # null: narration.voice_id, so the guide sounds like the chapters
  turn_eagerness: patient       # let the listener finish a thought
  turn_timeout: -1              # never answer a silence (the platform's default re-prompts after 7 s)
  # Stepping back: the page ends the voice connection (no model, no per-minute cost) when the guide
  # calls step_back or after a silence, and listens locally (page/wake.js) to bring it back.
  rest_after_silence_secs: 25   # nobody has spoken for this long: the guide steps back without a word
  rest_after_ready_secs: 12     # the same, after it came back for the chapter or because of a sound
  rest_after_no_words_secs: 90  # no words from either side for this long, however loud the room is
  rest_max_minutes: 90          # resting this long ends the conversation and releases the microphone
  wake:                         # the local listener: a sound in the voice band, well above the room, sustained
    ratio: 4                    # times the room's noise floor
    min_rms: 0.006              # and at least this loud (0-1, about -44 dBFS)
    need_ms: 240                # for this long within window_ms
    window_ms: 600
    max_sound_wakes: 8          # sounds may wake it this often between taps; two unanswered in a row also stop it
  max_duration_seconds: 2400    # a conversation can outlast the ~20-minute wait
  tool_timeout_secs: 30         # start_chapter starts a run on the local server
  client_js: https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.32.1/dist/lib.iife.js  # pinned, 2026-10-29

# One live voice (voice/gpt_live/, Spec "One Live Voice", Ian 2026-11-13): the guide's conversation and
# the chapter's reading in one OpenAI GPT-Live session, in one voice. The page (page/live.html) opens
# it over WebRTC through /api/live/start; the guide's tools run here through GPT-Live's delegation to a
# Responses backend (Terra). provider: elevenlabs puts the old page and agents back (left in place).
live:
  provider: gpt_live            # gpt_live | elevenlabs: the voice the page uses
  model: gpt-live-1             # the voice model (it writes the guide's spoken replies)
  voice: gleam                  # Ian's pick ("Gleam": North American, feminine, natural); fixed per session
  backend_model: gpt-6.1-terra  # Terra, the delegation backend that calls the tools (Ian: Terra over Luna).
                                # gpt-5.6-terra is the other Terra on the account (OpenAI's quickstart uses it)
  backend_effort: low           # none|minimal|low|medium|high|xhigh
  store: true                   # OpenAI keeps the session's audio 30 days, for the chapter's archive
  url: https://api.openai.com/v1/live/sessions
  price_per_minute: 0.05        # gpt-live-1, per connected second (silence and muted time included)
  backend_prices:               # $ per 1M tokens: input, output, cached input (OpenAI pricing, 2026-11-13)
    gpt-6.1-terra: [1.00, 5.00, 0.05]
    gpt-5.6-terra: [2.00, 12.00, 0.20]
    gpt-6-luna: [0.10, 0.50, 0.01]
  restart_bands_secs: [30, 120] # after a question: the interrupted sentence, one earlier, or the paragraph
  build_cap_usd: 20.00          # the build's own spending cap (voice/gpt_live/build_costs.jsonl)
  # The live checks' own size and cost (python -m voice.gpt_live persona|asides, voice/gpt_live/pagecheck.py).
  # Ian, 2026-11-16: "way too high for these small tests" ($15.84 by then: long sessions at $0.05 a connected
  # minute, and an Opus grade of every conversation). Now short by default, graded only when asked, and capped.
  checks:
    run_cap_usd: 0.40           # one check (a conversation, a page check) at most: not started past it, cut off at it
    max_minutes: 3              # a simulated conversation's connected time by default (was 6)
    max_turns: 8                # the simulated listener's lines by default (was 12)
    after_start: 1              # its lines after the chapter starts, then it stops (was 2)
    grade: false                # graded only with --grade (the grades were most of the Claude bill)
    grade_role: researcher      # and then on Sonnet 5.5 (models.researcher), effort medium, not Opus at high
  archive_wait_seconds: 120     # a chapter heard to the end: wait this long for OpenAI's recording, then archive
  archive_retry_seconds: 10
  # The guide's first words, said word for word when a new conversation starts (the Playground's
  # "Opening" box: not an API parameter, so the page sends it as speakable context the moment the
  # session starts; GPT-Live may still paraphrase). Empty: the guide greets in its own words
  # (notes.md `opened`). Example: opening: "Hey there."
  opening: ""
  continue_minutes: 15          # a page reopened this soon after the reading stopped picks the chapter back up
  unread_ready_minutes: 120     # a chapter written but never begun (they went away while it was made) is offered this long
  page:                         # page/live.js
    line_quiet_ms: 900          # a line of the transcript ends after this much quiet
    lead_in_max_ms: 9000        # the guide's line before the reading: at most this long
    stop_quiet_ms: 450          # after a tap, the reading has stopped once the transcript is this quiet
    silence_after_answer_secs: 6  # mid-chapter: silence after the guide's answer, then the page says so
    aside_give_up_secs: 6       # and if the guide still hasn't gone back this long after that, the reading goes on
    # A guide line like this mid-chapter goes back to the reading, whether or not resume_chapter follows
    lead_back: "\\b(where was i|where were we|(anyway|okay|ok|right|so),? back to|back to (it|the chapter|the story|the reading)\\b|picking (it|this|that) (back )?up|let'?s (keep going|get back|pick (it|this) (back )?up))"
    checkin_silence_secs: 8     # a check-in nobody answers: the guide says a word and waits
    position_seconds: 3         # report where the reading is (fast/player.json) this often
    rest_close_minutes: 20      # resting (muted, not reading) this long closes the session
    ready_beat_ms: 1000         # between sections, and before the reading resumes after a wait
    queue_words_left: 0         # the next paragraph is sent when this many words of the current one are left.
                                # 0: once it has finished. Sent earlier, GPT-Live sometimes dropped the queued
                                # one, or cut the current one's last sentence to start it (live, 2026-11-13);
                                # sent at the end, it starts 0.7-0.9 s later: a natural paragraph pause
    resend_ms: 3500             # a paragraph that should have started this long ago is sent again, once
    handback_quiet_ms: 2500     # a check-in hands back to the reading at the first pause this long
    reopen_ratio: 0.8           # GPT-Live's context this full (it compacts at 0.9): a new session at the next section
    reopen_before_expiry_minutes: 10  # or this close to the session's time limit (about 2 hours from its start)
    greet_fallback_ms: 5000     # no word from the guide this long after the session started: ask it to greet again
    answer_wait_ms: 12000       # a chapter ready while the guide's question is unanswered: wait this long for the answer
    start_nudge_ms: 10000       # the guide said it would start the chapter but start_chapter hasn't come: remind it
    # After Ian's second test (2026-11-15):
    hello_silence_secs: 7       # no word from the listener this long after the guide's hello: it checks in, once
    pitch_nudge_secs: [150, 210]  # into a conversation with no chapter yet: the guide is asked to move toward one
    ready_remind_secs: 120      # a ready chapter offered and not taken up: the guide asks once more, at a pause
    opening_estimate_secs: 240  # the ring's guess at the opening's wait when no earlier runs have timed it
    words_per_second: 2.5       # the slider's estimate of the reading's pace (voice/gpt_live/chapter.py WORDS_PER_SECOND)
    wake_listen_secs: 12        # resting, a sound opened the mic: no words this long and it rests again
    # Wake on sound, after Ian's fourth test (his voice to the guide, his son's roar and the kids measured about
    # the same in his recording, so loudness can't tell them apart): no wake for the first wake_grace_secs of a
    # rest, a longer sound needed (over voice.wake's settings), and none at all when they asked outright for the
    # mic off (mic_off_ask): then only a tap brings it back.
    wake_grace_secs: 15
    # When the chapter starts (Ian's fifth note): the guide steps back while it researches, unless the listener has
    # been chatting easily: at least engaged_lines lines so far, the last few averaging engaged_words words or more
    engaged_lines: 8
    engaged_words: 6
    step_back_wait_secs: 12     # and if the guide says nothing about stepping back this long after the start, it steps back anyway
    wake: {need_ms: 600, window_ms: 1000, min_rms: 0.02}
    mic_off_ask: "\\b((turn|switch|shut) (off )?(your|the) (mic|microphone)( off)?|(turn|switch|shut) (it|that) off|mute (yourself|your mic|the mic)|stop listening)\\b"
    aside_quiet_secs: 30        # a tap nobody speaks after: the chapter stays paused and the mic goes off
    end_hold_secs: 60           # after the last paragraph: the session stays this long, for the slider or a word
    # The listener asking for quiet, or saying they'll be away a minute (Ian's third test: "I'll pick up the
    # conversation later", "when it's ready we'll get back to ya", "you call me"), and the guide's parting words:
    # the page rests (the mic off) even when the guide doesn't call step_back (in his second test it didn't)
    quiet_ask: "\\b(some quiet|(have|want|need|for) (some )?quiet time|a (little|bit of) quiet|peace and quiet|be quiet|stop talking|no more talking|i'?ll just (wait|listen|sit)( for it)?|let'?s (just )?(have|take) (some|a) (quiet|break|pause)|give me some space|shh+|(turn|switch|shut) (off )?(your|the) (mic|microphone)( off)?|mute (yourself|your mic)|stop listening|(i'?ll|we'?ll) be right back|be right back|back in a (minute|min|sec|second|bit)|brb|(just )?call me when (it'?s|you'?re) (ready|done)|you call me(?=\\W*$)|(we'?ll|i'?ll) get back to (you|ya)|(talk|chat) (to you )?later(?=\\W*$)|pick (this |it |that |the conversation )?(back )?up( this| it| that| the conversation)? later|step away for a (minute|sec|second|bit)|go (ahead and )?(do|start) (your|the) research|go research|i'?ll let you (work|research|get to it|do your thing))\\b"
    step_back_said: "\\b(give you (some )?(space|quiet|peace)|i'?ll (be|stay|keep|go) quiet|enjoy the quiet|tap (me )?(when|if) you)\\b"
    # A ready chapter starts on start_reading, or on the listener's yes (a short one, the first thing they say)
    # to the guide's latest question when it offers the chapter (offer_question and offer_action both in it),
    # or on the guide's lead-in after an answer that isn't a no, or a tap, or the play button
    offer_question: "\\b(chapter|it'?s ready|it'?s done|it'?s finished|is ready|all set|ready for you)\\b"
    ready_yes: "^\\W*((oh|um+|uh+|well|hmm+|ah|so|okay so)\\W+)?(yes|yeah|yep|yup|ya|sure|ok(ay)?|alright|all right|go (for it|ahead|on)|let'?s (do it|go|hear it|start|begin)|please|definitely|absolutely|sounds good|i'?m ready|ready|start( it)?|play( it)?|do it|of course|why not|uh[- ]huh|mm[- ]hmm|totally|for sure)\\b"
    ready_not_yet: "\\b(no|nope|not (yet|now|right now|just yet)|don'?t|hang on|hold on|one (sec|second|minute|moment)|just a (sec|second|minute|moment|bit)|give me|wait|in a (minute|sec|second|bit|moment|while)|in \\w+ minutes|later|first|after|once i|when i|keep (chatting|talking|going)|finish|actually)\\b"
    offer_action: "\\b(hear|listen|start|begin|play|dive in|go|have it|now)\\b"  # with offer_question: an offer is a question that names it and asks to hear it
    ready_ask: "\\b(let'?s hear it|let'?s (listen|start|begin)|(play|read|start) (it|the chapter|my chapter)|i'?m ready(\\W*$| for it| to listen)|go ahead and (play|read|start))\\b"
    # A guide line that is only this, in an aside, is a stall, not an answer (Ian's third test: "Let me just give
    # that a thought", then nothing: it had handed the question to the backend). Anchored: a real short answer
    # with "hmm" or "good question" in it is an answer.
    stall: "^\\W*((yeah|okay|ok|so|oh|hmm+|huh|right|well)\\W+)*((that'?s )?(a )?(good|great|fair) (one|question)\\W+)?(let me (just )?(think( about (it|that))?|give (that|it|this) a (thought|think|sec|second)|try|check|see)|give me a (sec|second|moment)|on it|hmm+|huh|interesting)(\\W+(that'?s|that is|for a (sec|second|moment)))?\\W*$"
    talk_rest_secs: 90          # nobody has said anything this long in conversation: the mic goes off (tap to talk)
    lead_in: "\\b(here we go|here it is|let'?s dive in|let'?s begin|without further ado)\\b"
    # The guide's words for starting the chapter (the nudge above watches for them)
    start_promise: "\\b(starting (on )?(your|the) chapter|starting (it|that) (now|right now)\\b|i'?ll (go )?(start|get started on|get to work on|get going on) (it|that|this|your chapter|the chapter)\\b|i'?ll start on (it|that)|(i'?m |i am )?off to (research|write|make) (it|that|this|your chapter|the chapter)|getting (started|to work|going) on (it|that|this|your chapter|the chapter)\\b|let me (start|get started on|get to work on) (it|that|this|a|your|the)\\b)"

# Plain files about the listener (Phase 1 memory): profile.md, guide.md, sessions/, seeds/, history.md.
listener_dir: listener

# The single-prompt baseline: one agent, the build doc's 30-search cap.
baseline:
  max_searches: 30
  max_fetches: 30

tools:
  web_search: web_search_20260209
  web_fetch: web_fetch_20260209

# Server-side tool loops can pause; each pause is resumed with a new request.
# max_uses (above) applies per request, so the prompt states the search budget
# and the cost guard re-checks total spend before each continuation.
max_pause_continuations: 8

pricing:
  # USD per million tokens, from the Claude API pricing page (checked 2026-11-09).
  # cache_read is the cache-hit rate; where absent, input x cache_read_multiplier.
  # A model not listed here is charged at the most expensive listed rate.
  models:
    claude-opus-5-5:   {input: 4.00, output: 20.00, cache_read: 0.20}
    claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.10}
    claude-haiku-5-5:  {input: 0.10, output: 0.50}
    # Possible server-side fallback targets:
    claude-sonnet-5:   {input: 2.00, output: 10.00, cache_read: 0.20}
    claude-opus-5:     {input: 5.00, output: 25.00, cache_read: 0.50}
    claude-opus-4-8:   {input: 5.00, output: 25.00, cache_read: 0.50}
    claude-fable-5-2:  {input: 8.00, output: 40.00, cache_read: 0.20}
  cache_read_multiplier: 0.1
  cache_write_5m_multiplier: 1.25
  cache_write_1h_multiplier: 2.0
  web_search_per_1000: 10.00
  batch_multiplier: 0.5       # Message Batches API: half of every token rate

batch:
  poll_seconds: 20
  timeout_minutes: 90         # then cancel and send the request streamed

narration:
  provider: elevenlabs
  # Highest-quality narration model as of November 2026. Confirmed on the
  # account on 2026-11-10: eleven_v4, 10,000 characters per request.
  # `python cli.py voices` lists the models and voices on the account.
  model_id: eleven_v4
  voice_id: RILOU7YmBhvwJGDGjNmP  # Jane - Professional Audiobook Reader (British female, shared library). Ian's pick, 2026-11-10
  candidate_voices:
    # ElevenLabs premade voices, all three confirmed on the account.
    - {name: George, voice_id: JBFqnCBsd6RMkjVDRZzb}
    - {name: Brian, voice_id: nPczCjzI2devNBz1zQrb}
    - {name: Sarah, voice_id: EXAVITQu4vr4xnSDxMaL}
  # pcm_24000 has no plan gate in the SDK docs. pcm_44100 needs the Pro plan.
  output_format: pcm_24000
  voice_settings:
    stability: 0.6
    similarity_boost: 0.75
    style: 0.0
    use_speaker_boost: true
    speed: 1.0
  seed: 1234                  # same seed for every chunk, for a steadier voice
  max_chars_per_request: 4500 # chunk target; kept well under the model limit
  timestamps: true            # keep ElevenLabs' character timings with each chunk (episode page, asking mid-chapter)
  chunk_pause_ms: 450         # between chunks inside a segment
  segment_pause_ms: 1600      # at segment breaks
  beat_pause_ms: 1100         # a held beat, where the script says [pause] (eleven_v4 has no break tag,
                              # and its bracket tags can be read aloud, so the silence is inserted here)
  mp3_bitrate: 128k
  # Reported API rates: about $0.08-0.10 per 1,000 characters for eleven_v4.
  # The higher figure is used so the cost guard errs high. Confirm on elevenlabs.io.
  price_per_1000_chars: 0.10
  # Spelled the way the voice should say them. Whole words, case-sensitive.
  # Check every one in the voice test and adjust.
  pronunciations:
    Weil: Vay
    Diotima: Dee-oh-TEE-mah
    Boethius: Boh-EE-thee-us
    Aquinas: Uh-KWY-nus

# Ask mid-chapter, by voice (docs/ask-voice.md; code in ask/). The listener taps the circle while a
# chapter plays and talks with the same guide: a second ElevenLabs agent, made by stages/voice.py
# from prompts/guide_aside.md and prompts/guide_aside_tools.json with the guide's voice, model and
# effort (config voice). Its ids are in listener/voice_aside.json.
ask:
  agent_name: write-listen guide (aside)
  reasoning_effort: low         # the guide's judgement of when to go back; onboarding stays at none (voice)
  turn_timeout_secs: 30          # the page handles silence itself (below); the platform should not nudge first
  just_said_secs: 90             # what the guide is told was just said, word for word
  coming_secs: 180               # and what is coming
  restart_bands_secs: [30, 120]  # under 30 s: the interrupted sentence; to 120 s: one earlier; over: the paragraph
  fade_ms: 150                   # the chapter fades out over this on the tap
  resume_delay_ms: 400           # between the voice session ending and the chapter resuming
  slow_line_secs: 6              # still connecting: one plain line
  give_up_secs: 12               # never connected: resume the chapter
  silence_after_greeting_secs: 8
  silence_after_answer_secs: 3   # the guide's last turn invited nothing (no question mark)
  silence_after_question_secs: 8 # it asked something: give them longer
  long_aside_minutes: 5          # the guide may offer once to save the thread
  dossier_line_words: 24         # entries outside the current and next segment: one line each

# Fast Start (docs/fast-start.md; code in faststart/): the opening plays a few minutes after the
# topic is set, and the rest is researched, written, edited and narrated section by section while
# the listener listens. `python cli.py new --seed "..." --unattended --mode fast`. The overnight
# pipeline reads none of this.
fast:
  words_per_minute: 150
  target_minutes: 20
  sections: [3, 5]              # decided by the outline within these limits
  opening_min_minutes: 6        # the intro and section 1 together: time for the research behind section 2
  section_min_minutes: 3
  total_minutes: [18, 24]
  max_run_usd: 8.00             # the run's cap; starting a fast run approves spending up to it
  scout: {searches: 6, fetches: 3}
  research:
    per_row: {searches: 5, fetches: 2}
    max_searches: 30            # the agents of the outline's rows together. Beside it: the scout's own budget,
                                # and note_research.max_agents x searches (6) for listeners' notes: 36 at most
    parallel: 4
    row_timeout_seconds: 600    # after this a section is drafted without the row; it is flagged thin
  note_research: {searches: 3, fetches: 1, max_agents: 2}  # a listener's note the dossier cannot serve
  max_hold_seconds: 180         # the listener has waited this long for a section: lock it with a solo edit
  short_wait_seconds: 15        # a section expected sooner than this is just a pause, with no check-in
  silence_seconds: 8            # the check-in's mic closes after this much silence
  gap_mic: auto                 # auto: the mic opens with the check-in. tap: it waits for a tap
  position_seconds: 3           # how often the page reports the player's position
  narration:
    first_piece_max_chars: 450  # the first piece is one short paragraph, so the first audio comes soon
    piece_min_chars: 350        # after that, short paragraphs are narrated together up to about this
    piece_max_chars: 1500
    simulate_after_chars: null  # build tests only: past this many real characters, silence of the right
                                # length stands in for the voice (ElevenLabs characters are scarce)
    speech_chars_per_second: 15.5  # measured on three chapters: the voice's pace, and how fast
    synth_chars_per_second: 50     # ElevenLabs returns it (the simulated narration keeps both)
  timings_file: faststart/timings.json  # medians of earlier runs, for the guide's time estimate
  step_timeout_seconds: 600     # a draft, lock or narration with no result after this counts as failed
  exit_wait_seconds: 150        # a run that stops waits this long for calls in flight, so their cost is logged
                                # and their results kept for the run that continues (a hung call gets 5 s)
  tick_seconds: 0.5             # how often the run's loop looks at the clock and the listener's position
  build_cap_usd: 25.00          # the build's own cap: python -m faststart e2e and compare refuse to pass it
  early_scouts: 2               # scout_topic: at most this many early scouts in one conversation
  page:                         # the page's side of a fast run (page/fast.js, served with these)
    section_gap_ms: 1000        # between sections when the next one is ready: a pause, no check-in
    ready_beat_ms: 1000         # a section that was waited for starts after this beat when no conversation is open
    decision_wait_seconds: 20   # a wait the run has said nothing about for this long is treated as a check-in
    tap_wait_seconds: 20        # gap_mic: tap: how long the guide's question waits for the tap
    quiet_seconds: 1.5          # the listener counts as quiet (for the ready signal) after this long without speech
    stall_seconds: 30           # a check-in where nothing is said for this long (a guide that never speaks, steady
                                # noise on the mic) stops waiting on the mic's level: it closes, or the ready note goes
  checkin:                      # the guide's check-in when a section isn't ready: a third voice agent
    agent_name: write-listen guide (check-in)
    reasoning_effort: low
    turn_timeout_secs: 30       # the page handles silence itself; the platform should not nudge first
