# Commissioned audio chapter MVP: settings.
# API keys live in .env (gitignored), never here.

models:
  writer: claude-opus-5-5     # map, angles, ledger, ledger update, brief, draft, coverage, edit, revise, baseline
  researcher: claude-opus-5-5 # one research agent per ledger row (the add-on asks for Opus 5.5;
                              # claude-sonnet-5-5 would halve these agents' token cost)
  cheap: claude-haiku-5-5     # mechanical steps (currently: the ping test call)

# On a safety-classifier decline, the API re-runs the same request on a fallback
# model inside the same call ("default" lets the API pick by refusal category).
# The log records which model actually served each call. Set to null to turn off.
refusal_fallbacks: default
refusal_fallbacks_beta: server-side-fallback-2026-07-01

# Stop and ask before any single call or stage expected to cost more than this.
cost_guard_usd: 5.00

# Per-stage request settings. max_tokens covers thinking plus text; every call
# streams, so large values are safe. Effort: low | medium | high | xhigh | max.
# expected_* feed the cost guard's estimate only.
stages:
  ping:     {max_tokens: 1024, effort: low, expected_output_tokens: 20}
  smoketest: {max_tokens: 4000, effort: low, expected_output_tokens: 1000}
  # beauty-scarry, 2026-11-11: map hit 32000 (thinking + ~6,400 words of map) and angles used
  # 17,838 (over its old 16000) before finishing, so stages that write a long document get
  # 64000 (Opus 5.5 allows 128000). Billing is per token used; the guard uses expected_*.
  map:      {max_tokens: 64000, effort: high, expected_output_tokens: 40000}
  scout:    {max_tokens: 64000, effort: high, expected_output_tokens: 16000, max_continuations: 6}
  scout_writeup: {max_tokens: 64000, effort: high, expected_output_tokens: 12000}
  angles:   {max_tokens: 32000, effort: high, expected_output_tokens: 18000}
  choose:   {max_tokens: 32000, effort: high, expected_output_tokens: 8000}
  ledger:   {max_tokens: 64000, effort: high, expected_output_tokens: 8000}
  research_row:      {max_tokens: 64000, effort: high, expected_output_tokens: 16000, max_continuations: 6}
  research_followup: {max_tokens: 64000, effort: high, expected_output_tokens: 12000, max_continuations: 6}
  research_writeup:  {max_tokens: 64000, effort: high, expected_output_tokens: 12000}
  ledger_update:     {max_tokens: 64000, effort: high, expected_output_tokens: 8000}
  brief:    {max_tokens: 64000, effort: high, expected_output_tokens: 8000}
  draft:    {max_tokens: 32000, effort: high, expected_output_tokens: 5000}
  coverage: {max_tokens: 64000, effort: high, expected_output_tokens: 8000}
  edit:     {max_tokens: 64000, effort: high, expected_output_tokens: 12000}
  revise:   {max_tokens: 32000, effort: high, expected_output_tokens: 5000}
  baseline: {max_tokens: 64000, effort: high, expected_output_tokens: 30000, expected_input_tokens: 250000}

chapter:
  target_words: 6000
  target_minutes: 40
  min_segments: 6
  max_segments: 8
  segment_words: [750, 800]

# Ledger-driven research (docs/ledger-research-addon.md). Stage 03b writes 5-7
# ranked ideas to ledger.json; stage 04 runs one agent per active row, with a
# budget set by the row's rank and type; stage 04b judges each row and gives
# open or partial rows one follow-up agent.
research:
  min_rows: 5
  max_rows: 7
  top_ranks: 3                # ranks 1-3 get the "top" budget
  budgets:                    # per agent; the web tools' max_uses
    top:      {searches: 8, fetches: 4}   # deep-dive or missing, rank 1-3
    rest:     {searches: 4, fetches: 2}   # deep-dive or missing, rank 4 and below
    covered:  {searches: 2, fetches: 1}   # verify-only agent
    followup: {searches: 4, fetches: 2}   # the one follow-up round in stage 04b
  max_searches: 40            # all research agents together, follow-ups included; asks before going past
  parallel_agents: 4          # agents running at once
  max_usd: 25.00              # hard stop on research spend (agents and write-ups) in one invocation
  max_fetch_tokens: 20000     # cap on each fetched page's size in context
  # Domains whose tier is clear, for a check of the tiers agents record.
  # An entry claiming a better tier than its source's domain is flagged, never changed.
  tier_domains:
    gutenberg.org: 1
    perseus.tufts.edu: 1
    wikisource.org: 1
    plato.stanford.edu: 2
    iep.utm.edu: 2
    wikipedia.org: 4

# Seed runs (docs/phase1-onboarding.md): a 20-minute lesson made from a listener's seed, with no
# transcript. These values replace the ones above for any run with 00_source/seed.md.
seed_runs:
  chapter: {target_words: 3000, target_minutes: 20, min_segments: 4, max_segments: 4, segment_words: [700, 800]}
  research: {min_rows: 3, max_rows: 4}

# The scout maps the territory around a seed and finds candidate sources: the role the
# episode map plays for a transcript. One agent, these budgets (its web tools' max_uses).
scout:
  searches: 10
  fetches: 5

# `new --unattended`: nobody is asked anything. Each guard approves a stage if the run's
# spend plus the stage's estimate stays under this cap, and stops the run (with a report)
# if not; every request also checks the cap. Starting such a run is the approval.
unattended:
  max_run_usd: 20.00

# Minutes each step of an unattended seed run takes, for the page's "about N min". First guesses
# (about 25 in all); status.json records each step's real duration ("history") to calibrate them.
status_minutes:
  scout: 3
  angles: 1
  choose: 1
  ledger: 1
  research: 6
  ledger-update: 3
  brief: 1
  draft: 3
  assemble: 0
  coverage: 1
  edit: 1
  revise: 2
  narrate: 2
  report: 0

# Plain files about the listener (Phase 1 memory): profile.md, guide.md, sessions/, seeds/, history.md.
listener_dir: listener

# The single-prompt baseline: one agent, the build doc's 30-search cap.
baseline:
  max_searches: 30
  max_fetches: 30

tools:
  web_search: web_search_20260209
  web_fetch: web_fetch_20260209

# Server-side tool loops can pause; each pause is resumed with a new request.
# max_uses (above) applies per request, so the prompt states the search budget
# and the cost guard re-checks total spend before each continuation.
max_pause_continuations: 8

pricing:
  # USD per million tokens, from the Claude API pricing page (checked 2026-11-09).
  # cache_read is the cache-hit rate; where absent, input x cache_read_multiplier.
  # A model not listed here is charged at the most expensive listed rate.
  models:
    claude-opus-5-5:   {input: 4.00, output: 20.00, cache_read: 0.20}
    claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.10}
    claude-haiku-5-5:  {input: 0.10, output: 0.50}
    # Possible server-side fallback targets:
    claude-sonnet-5:   {input: 2.00, output: 10.00, cache_read: 0.20}
    claude-opus-5:     {input: 5.00, output: 25.00, cache_read: 0.50}
    claude-opus-4-8:   {input: 5.00, output: 25.00, cache_read: 0.50}
    claude-fable-5-2:  {input: 8.00, output: 40.00, cache_read: 0.20}
  cache_read_multiplier: 0.1
  cache_write_5m_multiplier: 1.25
  cache_write_1h_multiplier: 2.0
  web_search_per_1000: 10.00

narration:
  provider: elevenlabs
  # Highest-quality narration model as of November 2026. Confirmed on the
  # account on 2026-11-10: eleven_v4, 10,000 characters per request.
  # `python cli.py voices` lists the models and voices on the account.
  model_id: eleven_v4
  voice_id: RILOU7YmBhvwJGDGjNmP  # Jane - Professional Audiobook Reader (British female, shared library). Ian's pick, 2026-11-10
  candidate_voices:
    # ElevenLabs premade voices, all three confirmed on the account.
    - {name: George, voice_id: JBFqnCBsd6RMkjVDRZzb}
    - {name: Brian, voice_id: nPczCjzI2devNBz1zQrb}
    - {name: Sarah, voice_id: EXAVITQu4vr4xnSDxMaL}
  # pcm_24000 has no plan gate in the SDK docs. pcm_44100 needs the Pro plan.
  output_format: pcm_24000
  voice_settings:
    stability: 0.6
    similarity_boost: 0.75
    style: 0.0
    use_speaker_boost: true
    speed: 1.0
  seed: 1234                  # same seed for every chunk, for a steadier voice
  max_chars_per_request: 4500 # chunk target; kept well under the model limit
  chunk_pause_ms: 450         # between chunks inside a segment
  segment_pause_ms: 1600      # at segment breaks
  mp3_bitrate: 128k
  # Reported API rates: about $0.08-0.10 per 1,000 characters for eleven_v4.
  # The higher figure is used so the cost guard errs high. Confirm on elevenlabs.io.
  price_per_1000_chars: 0.10
  # Spelled the way the voice should say them. Whole words, case-sensitive.
  # Check every one in the voice test and adjust.
  pronunciations:
    Weil: Vay
    Diotima: Dee-oh-TEE-mah
    Boethius: Boh-EE-thee-us
    Aquinas: Uh-KWY-nus
