<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome</title>
<!--
  The welcome screen (docs/tester-demo.md, "Screens"): a dot, three words and the recording notice, nothing
  else. The tap unlocks sound, asks for the microphone (phones need both from a tap), records consent and
  starts the welcome talk (/interview.js). During the talk the next screen's markup (/app) and the scripts
  the server named are fetched into memory, never into this document. When the handover is decided (its last
  words are being said) they come into this same document under this screen (so the tap's sound and
  microphone stay unlocked), the next part opens its own voice session, held silent, and the dot grows over
  about two seconds into exactly the next screen's circle (its place, size and colour). At the handover the
  session is let go with the name and the mic, and this screen fades away over the same circle.
  Ids are prefixed w- so they never meet the next screen's, and this screen's state classes sit on #w-gate.
-->
<style id="w-base">
  html, body { margin: 0; height: 100%; background: #F5F2ED; overflow: hidden; }
</style>
<style>
  #w-gate { position: fixed; inset: 0; z-index: 1000; background: #F5F2ED; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #6B635C;
            -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
            transition: opacity .8s ease; }
  #w-gate.gone { opacity: 0; pointer-events: none; }
  #w-dot { width: 22px; height: 22px; border-radius: 50%; background: #A69D94;
           transition: background-color .6s ease; }
  #w-tap { margin-top: 22px; letter-spacing: .02em; transition: opacity .8s ease; }
  #w-note { position: absolute; left: 16px; right: 16px; bottom: max(18px, env(safe-area-inset-bottom));
            text-align: center; font-size: 12px; color: #8F867D; transition: opacity .8s ease; }
  #w-mic { display: none; margin-top: 22px; text-align: center; }
  #w-again { margin-top: 12px; font: inherit; color: #6B635C; background: none; border: 1px solid #6B635C;
             border-radius: 999px; padding: 6px 18px; cursor: pointer; }
  /* This screen's states are classes on #w-gate itself, never on <body>: the next screen's script rewrites
     <body>'s classes as it draws, and the three words came back over the growing dot (Ian, 2026-11-18). */
  #w-gate.w-on #w-dot { background: #6B635C; }
  #w-gate.w-on #w-tap, #w-gate.w-warm #w-tap { opacity: 0; }
  #w-gate.w-speaking #w-dot { animation: w-pulse 2.4s ease-in-out infinite; }
  #w-gate.w-refused #w-tap { display: none; }
  #w-gate.w-refused #w-mic { display: block; }
  #w-gate.w-warm #w-dot { background: #d9822b; animation: none;  /* about two seconds, to the place and size set in warm() */
                          transition: background-color 2s ease, left 2s ease, top 2s ease, width 2s ease, height 2s ease; }
  #w-gate.w-warm #w-note { opacity: 0; }
  #w-gate.w-warm { cursor: default; }
  @keyframes w-pulse { 50% { transform: scale(1.18); opacity: .8; } }
</style>
</head>
<body>
<div id="w-gate" role="button" aria-label="Tap to begin">
  <div id="w-dot"></div>
  <div id="w-tap">Tap to begin</div>
  <div id="w-mic"><div>I need your microphone to talk with you</div><button id="w-again" type="button">Try again</button></div>
  <div id="w-note">Your conversations are recorded so Ian can learn from them. Ask him to delete yours any time.</div>
</div>
<script src="/interview.js"></script>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const body = document.body;
  const gate = $("w-gate").classList;  // this screen's states live on it (see the styles)
  const W = { busy: false, ctx: null, stream: null, pre: null, ready: null, warmAt: 0 };
  window.Welcome = W;  // for tests

  function begin(e) {
    if (e) e.stopPropagation();
    if (W.busy) return;
    W.busy = true;
    gate.remove("w-refused");
    // All of this inside the tap, before any await: phones allow sound and the microphone only from a gesture.
    try {
      W.ctx = W.ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (W.ctx.state === "suspended") W.ctx.resume().catch(() => {});
    } catch (x) { W.ctx = null; }
    if (window.Interview) Interview.unlock(W.ctx);
    let asked;
    try {
      asked = Speaker.mic();  // the phone's loudspeaker, then the mic (page/speaker.js, served with /interview.js)
    } catch (x) { asked = Promise.reject(x); }
    asked.then(talk, refused);
  }

  function refused() {
    W.busy = false;
    gate.remove("w-on", "w-speaking");
    gate.add("w-refused");
  }

  async function talk(stream) {
    W.stream = stream;
    gate.add("w-on");
    try { await fetch("/api/demo/consent", { method: "POST" }); } catch (x) { /* the talk goes on */ }
    const ok = await Interview.start("intro", {
      stream,
      onState: (s) => gate.toggle("w-speaking", s === "speaking"),
      onNear: near,
      onHandoff: handOn,
      onDone: again,
    });
    if (!ok && !W.handed) return again();
    preload(Interview.I.next);
  }

  // During the talk: the next screen and its scripts are fetched into memory (this document stays as it is
  // until the handover), so the handover waits on no download.
  function preload(next) {
    if (W.pre || !next) return;
    const text = (src) => fetch(src).then((r) => (r.ok ? r.text() : null)).catch(() => null);
    W.pre = { app: fetch("/app").then((r) => (r.ok ? r.json() : null)).catch(() => null),
              scripts: (next.scripts || []).map((src) => ({ src, text: text(src) })) };
  }

  // The talk ended before any handover (it couldn't start, or dropped): back to the dot and three words.
  function again() {
    if (W.handed) return;
    W.busy = false;
    gate.remove("w-on", "w-speaking");
  }

  // The handover is decided, its last words still being said: the next screen comes in under this one, its
  // scripts run, it opens its own voice session (held: silent, hearing nothing) and the dot starts to grow.
  function near(h) {
    if (!W.ready) W.ready = bring(h);
    return W.ready;
  }

  async function bring(h) {
    preload(h);
    const got = W.pre ? await W.pre.app : null;
    if (got) {
      const style = document.createElement("style");
      style.textContent = got.style || "";
      document.head.appendChild(style);
      const base = $("w-base");
      if (base) base.remove();
      $("w-gate").insertAdjacentHTML("beforebegin", got.body || "");
      body.classList.add("tester");
    }
    for (const src of h.scripts || []) {
      const pre = W.pre && W.pre.scripts.find((x) => x.src === src);
      const code = pre ? await pre.text : null;
      if (code) run(code, src); else await load(src);
    }
    const target = (h.entry && window[h.entry]) || null;
    if (target && typeof target.handoff === "function") target.handoff({ stream: W.stream, hold: true });
    let to = null;
    try { to = target && typeof target.spot === "function" ? target.spot() : null; } catch (x) { to = null; }
    warm(to);
    return target;
  }

  // The dot grows from where it is into the next screen's circle (`to`: {x, y, w, h, color}), so nothing
  // jumps when this screen fades; without one, into a circle in the middle.
  function warm(to) {
    const dot = $("w-dot"), r = dot.getBoundingClientRect(), d = dot.offsetWidth;
    const end = to && to.w ? to : { x: innerWidth / 2 - 70, y: innerHeight / 2 - 70, w: 140, h: 140 };
    Object.assign(dot.style, { position: "fixed", left: (r.left + r.width / 2 - d / 2) + "px",
                               top: (r.top + r.height / 2 - d / 2) + "px", width: d + "px", height: d + "px" });
    dot.getBoundingClientRect();  // it starts from where it is
    gate.add("w-warm");
    Object.assign(dot.style, { left: end.x + "px", top: end.y + "px", width: end.w + "px", height: end.h + "px" });
    if (end.color) dot.style.backgroundColor = end.color;
    W.warmAt = Date.now();
  }

  async function handOn(h) {
    if (W.handed) return;
    W.handed = true;
    gate.remove("w-speaking");
    const target = await near(h);
    if (target && typeof target.handoff === "function") target.handoff({ name: h.name, stream: h.stream || W.stream });
    const left = W.warmAt + 2000 - Date.now();  // the dot has finished growing
    if (left > 0) await new Promise((r) => setTimeout(r, left));
    $("w-gate").classList.add("gone");
    setTimeout(() => { const g = $("w-gate"); if (g) g.remove(); }, 900);
  }

  function run(code, src) {  // a script fetched during the talk
    const s = document.createElement("script");
    s.textContent = code + "\n//# sourceURL=" + src;
    document.body.appendChild(s);
  }

  function load(src) {
    return new Promise((done) => {
      const s = document.createElement("script");
      s.src = src;
      s.async = false;
      s.onload = () => done(true);
      s.onerror = () => done(false);
      document.body.appendChild(s);
    });
  }

  $("w-gate").onclick = begin;
  $("w-again").onclick = begin;
})();
</script>
</body>
</html>
