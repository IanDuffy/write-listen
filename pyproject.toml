[project]
name = "chapter-mvp"
version = "0.1.0"
description = "Turn one podcast transcript into one researched, edited, narrated audio chapter."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.7,<3",
    "elevenlabs>=2.77,<3",
    "pypdf>=7,<8",
    "pyyaml>=6",
    "python-dotenv>=1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=14",  # overnight/record.py: GPT-Live, server-side
    "numpy>=2",        # overnight/record.py: cutting takes
    "httpx>=0.27",     # overnight/live.py: opening GPT-Live sessions (also an anthropic dependency)
    "faster-whisper==1.2.1",  # episode/recognize.py: overnight take checks and timing.json (local Whisper)
    "materialyoucolor==3.0.4",
]

[dependency-groups]
dev = ["pytest>=8", "playwright==1.58.0"]  # playwright: the browser tests (then `playwright install chromium`)

[tool.pytest.ini_options]
testpaths = ["tests"]
