[project]
name = "chapter-mvp"
version = "0.1.0"
description = "Turn one podcast transcript into one researched, edited, narrated audio chapter."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.7,<3",
    "elevenlabs>=2.77,<3",
    "pypdf>=7,<8",
    "pyyaml>=6",
    "python-dotenv>=1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
