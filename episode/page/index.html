<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Episode</title>
<!--
  The episode page (add-on: timed transcript and references). One static file plus timing.js; no
  framework, no build step, no dependency on the onboarding server. It reads
  <run>/11_episode/episode.json and the audio from the run folder named in the URL:
      python -m http.server 8000        (from the repository root)
      http://localhost:8000/episode/page/index.html?run=/runs/beauty-scarry
  Keys: space plays and pauses; left and right arrows move one sentence.
-->
<style>
  :root { --accent: #d9822b; --bg: #fafaf8; --fg: #1d1d1b; --muted: #77756f; --line: #e4e2dc; --soft: #f3e3d1; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --fg: #ecebe6; --muted: #9a988f; --line: #2c2b28; --soft: #3a2a1b; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 18px/1.75 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { max-width: 1100px; margin: 0 auto; padding: 28px 20px 8px; }
  h1 { font-size: 26px; line-height: 1.3; margin: 0 0 4px; }
  #angle { color: var(--muted); font-size: 15px; margin: 0; }
  #player { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); }
  #player .inner { max-width: 1100px; margin: 0 auto; padding: 10px 20px; display: flex; gap: 14px; align-items: center; }
  #play { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent); color: #fff;
          font-size: 18px; cursor: pointer; flex: none; }
  #seek { flex: 1; accent-color: var(--accent); }
  #clock { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; white-space: nowrap; }
  #layout { max-width: 1100px; margin: 0 auto; padding: 8px 20px 80px; display: grid;
            grid-template-columns: minmax(0, 1fr) 300px; gap: 36px; }
  @media (max-width: 820px) { #layout { grid-template-columns: 1fr; } #cards { position: static; max-height: none; } }
  #transcript section { margin: 0 0 30px; }
  #transcript h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 24px 0 6px; }
  .s { border-radius: 4px; transition: background .2s; }
  .s.current { background: var(--soft); }
  .w { cursor: pointer; border-radius: 3px; }
  .w:hover { text-decoration: underline; text-decoration-color: var(--line); }
  .w.current { background: var(--accent); color: #fff; }
  #cards { position: sticky; top: 76px; align-self: start; max-height: calc(100vh - 96px); overflow: auto; }
  #cards h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 0 0 10px; font-size: 15px;
          line-height: 1.45; transition: border-color .3s; }
  .card.latest { border-color: var(--accent); }
  .card .kind { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .card .title { font-weight: 600; }
  .card.quote .title { font-weight: 400; font-style: italic; }
  .card .meta, .card .note { color: var(--muted); }
  .card a { color: var(--accent); }
  #now { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); display: none; border: 0;
         background: var(--accent); color: #fff; border-radius: 999px; padding: 8px 18px; font: inherit; font-size: 15px;
         cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
  #now.show { display: block; }
  details.aside { display: block; margin: 8px 0 10px; padding: 2px 0 2px 12px; border-left: 2px solid var(--accent);
                  font-size: 15px; line-height: 1.5; color: var(--muted); }
  details.aside summary { cursor: pointer; }
  details.aside p { margin: 4px 0; }
  details.aside .guide { color: var(--fg); }
  #problem { max-width: 1100px; margin: 40px auto; padding: 0 20px; color: var(--muted); display: none; }
</style>
</head>
<body>
<header><h1 id="title">Loading…</h1><p id="angle"></p></header>
<div id="player"><div class="inner">
  <button id="play" aria-label="Play">▶</button>
  <input id="seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="Seek">
  <span id="clock">0:00 / 0:00</span>
</div></div>
<div id="layout">
  <main id="transcript" aria-live="off"></main>
  <aside id="cards"><h2>References</h2><div id="cardlist"></div></aside>
</div>
<button id="now">Back to now</button>
<p id="problem"></p>
<audio id="audio" preload="metadata"></audio>
<script src="timing.js"></script>
<script>
const T = window.EpisodeTiming;
const $ = (id) => document.getElementById(id);
const audio = $("audio");
let ep = null, words = [], sentences = [], wordEls = [], sentenceEls = {};
let curWord = -1, curSentence = null, shownCards = -1;
let following = true, autoScrolling = false;

const run = (new URLSearchParams(location.search).get("run") || "").replace(/\/$/, "");

async function load() {
  if (!run) return fail("Add ?run=<path to a run folder> to the address.");
  let res;
  try { res = await fetch(`${run}/11_episode/episode.json`); } catch (e) { return fail("The episode could not be loaded."); }
  if (!res.ok) return fail(`No episode at ${run}/11_episode/episode.json. Run: python -m episode build <run>`);
  ep = await res.json();
  const plain = (x) => (x || "").replace(/[*_]/g, "");  // markdown emphasis in titles
  document.title = plain(ep.title);
  $("title").textContent = plain(ep.title);
  $("angle").textContent = ep.angle && ep.angle !== ep.title ? plain(ep.angle) : "";
  loadAudio(`${run}/${ep.audio}`);
  $("seek").max = ep.duration;
  words = T.flattenWords(ep);
  sentences = T.flattenSentences(ep);
  renderTranscript();
  loadAsides();
  tick();
}

// Asides (docs/ask-voice.md): conversations with the guide during the chapter, logged by the server
// to <run>/12_asks/asides.jsonl, shown where they interrupted, collapsed to their first line.
async function loadAsides() {
  let text = "";
  try {
    const res = await fetch(`${run}/12_asks/asides.jsonl`, { cache: "no-store" });
    if (!res.ok) return;
    text = await res.text();
  } catch (e) { return; }
  text.split("\n").filter((l) => l.trim()).forEach((l) => {
    let x;
    try { x = JSON.parse(l); } catch (e) { return; }
    const se = sentenceEls[x.sentence_id];
    const said = (x.transcript || []).filter((y) => (y.who === "guide" || y.who === "listener") && (y.text || "").trim());
    if (!se || !said.length) return;
    const d = document.createElement("details");
    d.className = "aside";
    said.forEach((y, i) => {
      const el = document.createElement(i === 0 ? "summary" : "p");
      el.className = y.who;
      el.textContent = (y.who === "listener" ? "You: " : "") + y.text;
      d.appendChild(el);
    });
    se.before(d);  // where the chapter was interrupted: before the sentence it picked up from
  });
}

// Fetched whole into memory: a server without range requests (python -m http.server) can't
// otherwise be seeked in Chrome, and the chapter is a few tens of megabytes on a local disk.
async function loadAudio(url) {
  $("clock").textContent = "Loading audio…";
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.status);
    audio.src = URL.createObjectURL(await res.blob());
  } catch (e) {
    audio.src = url;  // play straight from the server, even if it can't seek
  }
  tick();
}

function fail(msg) { $("problem").textContent = msg; $("problem").style.display = "block"; $("title").textContent = "Episode"; }

function renderTranscript() {
  const main = $("transcript");
  ep.segments.forEach((s, si) => {
    const sec = document.createElement("section");
    const h = document.createElement("h2");
    h.textContent = `Part ${si + 1}`;
    sec.appendChild(h);
    const p = document.createElement("p");
    s.sentences.forEach((x) => {
      const se = document.createElement("span");
      se.className = "s";
      se.id = x.id;
      let italic = false;  // the script marks titles in markdown, *like this*, across words
      x.words.forEach((w, wi) => {
        const we = document.createElement("span");
        we.className = "w";
        const opens = /^["“‘(]*\*/.test(w.w), closes = /\*["”’).,;:!?]*$/.test(w.w);
        if (opens) italic = true;
        we.textContent = w.w.replace(/\*/g, "");
        if (italic) we.style.fontStyle = "italic";
        if (closes) italic = false;
        we.dataset.i = wordEls.length;
        wordEls.push(we);
        se.appendChild(we);
        if (wi < x.words.length - 1) se.appendChild(document.createTextNode(" "));
      });
      sentenceEls[x.id] = se;
      p.appendChild(se);
      p.appendChild(document.createTextNode(" "));
    });
    sec.appendChild(p);
    main.appendChild(sec);
  });
  main.addEventListener("click", (e) => {  // click a word: jump the audio there
    const i = e.target.dataset && e.target.dataset.i;
    if (i === undefined) return;
    audio.currentTime = words[+i].start;
    following = true;
    $("now").classList.remove("show");
    tick();
  });
}

// Cards spoken so far, newest first. Changed one card at a time (not rebuilt), so a focused link
// and the list's scroll position survive new cards arriving.
function renderCards(t) {
  const n = T.referencesUpTo(ep.references, t).length;
  if (n === shownCards + 1) return;
  const list = $("cardlist");
  while (shownCards + 1 > n) { list.firstElementChild.remove(); shownCards--; }  // seeked back
  while (shownCards + 1 < n) { shownCards++; list.prepend(makeCard(ep.references[shownCards])); }
  list.querySelectorAll(".card.latest").forEach((c) => c.classList.remove("latest"));
  if (list.firstElementChild) list.firstElementChild.classList.add("latest");
}

function makeCard(r) {
    const c = document.createElement("div");
    c.className = `card ${r.kind}`;
    c.dataset.ref = r.id;
    const kind = document.createElement("div");
    kind.className = "kind";
    kind.textContent = { source: "Source", work: "Work", person: "Person", quote: "Quote" }[r.kind] + ` · ${T.formatTime(r.start)}`;
    const title = document.createElement("div");
    title.className = "title";
    if (r.url) {
      const a = document.createElement("a");
      a.href = r.url; a.target = "_blank"; a.rel = "noopener";
      a.textContent = r.kind === "quote" ? `“${r.title}”` : r.title;
      title.appendChild(a);
    } else title.textContent = r.kind === "quote" ? `“${r.title}”` : r.title;
    c.append(kind, title);
    if (r.creator) { const m = document.createElement("div"); m.className = "meta"; m.textContent = r.creator; c.appendChild(m); }
    if (r.note) { const n = document.createElement("div"); n.className = "note"; n.textContent = r.note; c.appendChild(n); }
    return c;
}

function tick() {
  if (!ep) return;
  const t = audio.currentTime;
  const wi = T.currentWordIndex(words, t);
  if (wi !== curWord) {
    if (curWord >= 0) wordEls[curWord].classList.remove("current");
    curWord = wi;
    if (wi >= 0) {
      wordEls[wi].classList.add("current");
      const sid = words[wi].sentenceId;
      if (sid !== curSentence) {
        if (curSentence) sentenceEls[curSentence].classList.remove("current");
        curSentence = sid;
        sentenceEls[sid].classList.add("current");
        if (following) autoScroll(sentenceEls[sid]);
      }
    }
  }
  renderCards(t);
  $("seek").value = t;
  $("clock").textContent = `${T.formatTime(t)} / ${T.formatTime(ep.duration)}`;
  $("play").textContent = audio.paused ? "▶" : "❚❚";
  $("play").setAttribute("aria-label", audio.paused ? "Play" : "Pause");
  document.body.dataset.word = wi >= 0 ? `${words[wi].sentenceId}:${words[wi].word}` : "";  // for tests
}

function loop() { tick(); if (!audio.paused) requestAnimationFrame(loop); }
audio.addEventListener("play", () => requestAnimationFrame(loop));
audio.addEventListener("pause", tick);
audio.addEventListener("seeked", tick);
audio.addEventListener("timeupdate", () => { if (audio.paused) tick(); });

$("play").addEventListener("click", () => (audio.paused ? audio.play() : audio.pause()));
$("seek").addEventListener("input", (e) => { audio.currentTime = +e.target.value; tick(); });

// Following pauses when the listener scrolls the page (wheel, keys, scrollbar or touch: any scroll
// the page didn't make itself), and resumes from "Back to now". Scrolling the references panel
// scrolls only that panel, so it doesn't pause following.
let scrollTimer = null;
function autoScroll(el) {
  autoScrolling = true;
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(() => { autoScrolling = false; }, 1200);  // where 'scrollend' is missing
  el.scrollIntoView({ block: "center", behavior: "smooth" });
}
addEventListener("scrollend", () => { if (autoScrolling) { clearTimeout(scrollTimer); autoScrolling = false; } });
addEventListener("scroll", () => {
  if (autoScrolling || !ep || !following) return;
  following = false;
  $("now").classList.add("show");
}, { passive: true });
$("now").addEventListener("click", () => {
  following = true;
  $("now").classList.remove("show");
  if (curSentence) autoScroll(sentenceEls[curSentence]);
});

addEventListener("keydown", (e) => {
  // Bare keys only (Alt/Cmd+arrow stay the browser's Back and Forward), and on the seek bar too.
  if (!ep || e.altKey || e.metaKey || e.ctrlKey || (e.target.tagName === "INPUT" && e.target.id !== "seek")) return;
  if (e.code === "Space") { e.preventDefault(); audio.paused ? audio.play() : audio.pause(); }
  else if (e.code === "ArrowRight" || e.code === "ArrowLeft") {
    e.preventDefault();
    audio.currentTime = T.sentenceStep(sentences, audio.currentTime, e.code === "ArrowRight" ? 1 : -1);
    following = true;
    $("now").classList.remove("show");
    tick();
  }
});

load();
</script>
</body>
</html>
